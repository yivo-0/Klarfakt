title: Klarfakt
description: >-
  Read and validate EN 16931 electronic invoices in .NET.
  No Java, no Node, nothing leaves your server.
url: https://klarfakt.dev
author: Oleh Yanytskyi
repository_url: https://github.com/yivo-0/Klarfakt

# No theme. The layouts and stylesheet in this folder are the whole site, so the pages carry no
# host branding and load no fonts from anyone else's server.
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

permalink: /:year/:month/:title/

feed:
  path: feed.xml

defaults:
  - scope:
      path: ""
    values:
      image: /social-card.png

# README.md is the index of the docs folder when browsing the repository on GitHub; index.md is
# the landing page of the site. Serving both would put the same links on two URLs.
exclude:
  - README.md
