name: rule-updates

# The subscription promises that upstream rule releases are tracked. This makes the tracking
# mechanical rather than a promise: it checks every Monday and opens an issue when a pack falls
# behind. It deliberately does not bump anything — a rule update can change the verdict on invoices
# that previously passed, so the bump needs a human reading the upstream changelog.
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      # Not continue-on-error. The script exits 1 when a pack is behind, which is news rather than
      # a broken run — but it also exits 1 when it could not reach upstream at all, and swallowing
      # that made a green weekly run the expected outcome whether or not anything was checked.
      # Both cases open an issue, so a red run here is the notification, not a nuisance.
      - name: Check pinned rule packs against upstream
        run: python tools/check-rule-updates.py --issue
