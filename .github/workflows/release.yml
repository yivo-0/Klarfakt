name: release

# Publishing is driven by an annotated tag on main: git tag -a v1.0.0 -m "..." && git push origin v1.0.0
# A NuGet version can never be replaced or deleted, only unlisted, so the full suite runs first.
#
# Authentication is Trusted Publishing, not an API key. nuget.org holds a policy naming this
# repository and this workflow file, so renaming release.yml breaks publishing until the policy is
# updated to match. The only secret is NUGET_USER, which is a nuget.org profile name, not a
# credential.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Lets this job ask GitHub for an OIDC token. It grants nothing on nuget.org by itself:
      # nuget.org decides whether to accept the identity by matching it against the trusted
      # publishing policy, so there is no long-lived key here to leak or to remember to rotate.
      id-token: write

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Take the version from the tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # This file used to repeat a subset of ci.yml's checks and the two drifted, so the workflow
      # doing the irreversible thing ended up with the weaker gate. Rather than copy the list a
      # third time, refuse to publish a commit whose own ci run did not pass — which covers the
      # reference comparison and the command line smoke tests without duplicating either.
      #
      # No check runs at all is a refusal, not a pass: that is the same mistake in a different
      # costume.
      - name: Require ci to have passed on this commit
        run: |
          for attempt in $(seq 1 40); do
            states=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" \
              --jq '.check_runs[] | select(.name != "publish") | "\(.status):\(.conclusion)"')

            if [ -z "$states" ]; then
              echo "no checks reported for $GITHUB_SHA yet (attempt $attempt)"
            elif echo "$states" | grep -qv '^completed:'; then
              echo "waiting for checks to finish (attempt $attempt)"
            else
              break
            fi

            sleep 15
          done

          echo "$states"

          if [ -z "$states" ]; then
            echo "::error::No ci run exists for $GITHUB_SHA. Refusing to publish an unchecked commit."
            exit 1
          fi

          if echo "$states" | grep -qv '^completed:success$'; then
            echo "::error::ci did not pass on $GITHUB_SHA. Refusing to publish."
            exit 1
          fi

      - name: Build
        run: dotnet build --configuration Release -p:Version=$VERSION -warnaserror

      - name: Restore the rule packs
        run: dotnet run --project src/Klarfakt.Cli --configuration Release --no-build -- rules restore

      - name: Fetch the official test corpora
        run: python tools/fetch-corpus.py

      # KLARFAKT_REQUIRE_CORPUS makes a missing corpus or an unrestored rule pack a failure. Without
      # it most of the suite returns early and a green run proves nothing — and this is the run that
      # cannot be taken back. ci.yml has always set it; this file did not.
      - name: Test
        env:
          KLARFAKT_REQUIRE_CORPUS: 1
        run: dotnet test --configuration Release --no-build

      - name: Pack
        run: dotnet pack --configuration Release --no-build -p:Version=$VERSION --output artifacts

      # Packing is not the same as being usable. Builds and runs samples/Quickstart against the
      # packed .nupkg from a clean directory with its own package cache, so a file left out of the
      # package fails here rather than in someone else's first five minutes. Repeated from ci.yml
      # deliberately: this is the only check whose subject is the exact artefact being pushed.
      - name: Verify the package from a clean directory
        run: python tools/verify-package.py

      # Trade the OIDC token for an API key valid for one hour. Requested here rather than at the
      # top of the job because the build, restore and test steps above take minutes, and a key
      # fetched too early expires before the push.
      - name: Exchange the workflow identity for a short-lived key
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Publish the GitHub release
        run: gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg --generate-notes --title "$GITHUB_REF_NAME"
